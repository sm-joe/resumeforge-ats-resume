services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: resumeforge-api:local
    restart: unless-stopped
    
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/apps/api/src
      RESUMEFORGE_DATA_DIR: /app/data

    ports:
      - "8000:8000"

    volumes:
      - resumeforge_data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: resumeforge-web:local
    restart: unless-stopped

    environment:
      NODE_ENV: production
      RESUMEFORGE_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"

    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
    resumeforge_data:
      name: resumeforge_data