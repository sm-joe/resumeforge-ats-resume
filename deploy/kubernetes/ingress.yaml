apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resumeforge
  namespace: resumeforge
  labels:
    app.kubernetes.io/name: resumeforge
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: resumeforge
spec:
  ingressClassName: nginx
  rules:
    - host: resumeforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resumeforge-web
                port:
                  number: 3000