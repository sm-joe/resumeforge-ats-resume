name: Release Security & Docker Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci --prefix apps/web

      - name: NPM Audit
        run: npm audit --prefix apps/web --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/analyzer/uv.lock
            apps/api/pyproject.toml
            apps/analyzer/pyproject.toml

      - name: Sync API Dependencies for Audit
        run: uv sync --project apps/api --locked

      - name: Install Analyzer for Audit
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            ./apps/analyzer

      - name: Audit Python Dependencies
        run: |
          uv pip install --system pip-audit
          pip-audit --strict --desc --ignore-vuln PYSEC-0000

  docker:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: resumeforge-api:release-audit
      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: resumeforge-api:release-audit
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: resumeforge-web:release-audit
      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: resumeforge-web:release-audit
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
