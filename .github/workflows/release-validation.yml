name: Release Security & Docker Validation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish stable v1.0.0 after all release checks pass"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Stable release version (v1.0.0)"
        type: string
        required: false
        default: "v1.0.0"
  push:
    branches:
      - release/v1.0.0-candidate

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL Release Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/release/${{ matrix.language }}"

  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - name: Render And Verify Kustomize
        run: |
          kubectl kustomize deploy/kubernetes > /tmp/resumeforge-k8s.yaml
          grep -q 'kind: PersistentVolumeClaim' /tmp/resumeforge-k8s.yaml
          grep -q 'RESUMEFORGE_DATA_DIR' /tmp/resumeforge-k8s.yaml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci --prefix apps/web

      - name: NPM Audit
        run: npm audit --prefix apps/web --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/analyzer/uv.lock
            apps/api/pyproject.toml
            apps/analyzer/pyproject.toml

      - name: Sync API Dependencies for Audit
        run: uv sync --project apps/api --locked

      - name: Install Analyzer for Audit
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            ./apps/analyzer

      - name: Audit Python Dependencies
        run: |
          uv pip install --system pip-audit
          pip-audit --strict --desc --ignore-vuln PYSEC-0000

  docker:
    name: Docker Build & Vulnerability Scan
    # Playwright's Chromium dependencies are supported on Ubuntu 24.04;
    # ubuntu-latest currently resolves to an unsupported Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    needs: [security, codeql, kubernetes]
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: resumeforge-api:release-audit
      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: resumeforge-api:release-audit
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: resumeforge-web:release-audit
      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: resumeforge-web:release-audit
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Tag Scanned Images For Local Acceptance
        run: |
          docker tag resumeforge-api:release-audit resumeforge-api:local
          docker tag resumeforge-web:release-audit resumeforge-web:local

      - name: Start Production-Like Compose Stack
        run: docker compose -f deploy/compose/compose.yaml up -d --no-build --wait

      - name: Setup Node For Browser Acceptance
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Browser Test Dependencies
        run: npm install --prefix tests/e2e --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npm exec --prefix tests/e2e -- playwright install --with-deps chromium

      - name: Run End-to-End Product Acceptance
        env:
          RESUMEFORGE_E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run test --prefix tests/e2e

      - name: Upload Browser Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resumeforge-playwright-evidence
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore

      - name: Stop Acceptance Stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down --remove-orphans

      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: resumeforge-api:release-audit
          format: spdx-json
          output-file: sbom-api.spdx.json
          artifact-name: resumeforge-api-sbom
          upload-release-assets: "false"

      - name: Generate Web SPDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: resumeforge-web:release-audit
          format: spdx-json
          output-file: sbom-web.spdx.json
          artifact-name: resumeforge-web-sbom
          upload-release-assets: "false"

      - name: Verify Stable Publication Request
        if: ${{ inputs.publish }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Stable publication must run from main"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v1.0.0" ]]; then
            echo "Unsupported stable tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Release tag already exists; immutable release refused"
            exit 1
          fi

      - name: Authenticate GHCR For Publication
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Exact Scanned Release Images
        if: ${{ inputs.publish }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          : > release-evidence.txt
          for component in api web; do
            image="ghcr.io/${OWNER}/resumeforge-${component}"
            docker tag "resumeforge-${component}:release-audit" "${image}:${RELEASE_TAG}"
            docker tag "resumeforge-${component}:release-audit" "${image}:${GITHUB_SHA}"
            docker push "${image}:${RELEASE_TAG}"
            docker push "${image}:${GITHUB_SHA}"
            digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
            printf '%s@%s\n' "${image}" "${digest}" | tee -a release-evidence.txt
          done

      - name: Install Cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign Release Image Digests With OIDC
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            cosign sign --yes "$image"
          done < release-evidence.txt

      - name: Publish Stable GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            sbom-api.spdx.json \
            sbom-web.spdx.json \
            release-evidence.txt \
            --target "$GITHUB_SHA" \
            --title "ResumeForge $RELEASE_TAG" \
            --notes-file docs/releases/v1.0.0.md
