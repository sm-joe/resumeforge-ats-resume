name: CI Security & Container Build

on:
  pull_request:
    branches:
      - main
      
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'deploy/**'

            ci:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'deploy/**'
              - '.github/**'
              - 'tests/**'
              - 'packages/**'

  ci:
    name: CI Run
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.ci == 'true'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Node.js dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix packages/resume-schema

      - name: Build Resume Schema
        run: npm run build --prefix packages/resume-schema

      - name: Build Web Appplication
        run: npm run build --prefix apps/web

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/analyzer/uv.lock

      - name: Sync API Dependencies
        run: uv sync --project apps/api --locked

      - name: Install Analyzer
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            apps/analyzer

      - name: Test API
        run: uv run --project apps/analyzer --with pytest pytest tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: 
      - changes
      - ci

    if: needs.changes.outputs.ci == 'true' && needs.ci.result == 'success'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/javascript
            p/typescript
            p/python

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci --prefix apps/web

      - name: NPM Audit
        run: npm audit --prefix apps/web --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.19"

      - name: Sync API Dependencies for Audit
        run: uv sync --project apps/api --locked

      - name: Install Analyzer for Audit
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            apps/analyzer

      - name: Audit Python Dependencies
        run: |
          uv pip install --system pip-audit
          pip-audit --strict --desc --ignore-vuln PYSEC-0000

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: 
      - changes
      - security

    if: needs.changes.outputs.docker == 'true' && needs.security.result == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: resumeforge-api:ci
          cache-from: type=gha,scope=resumeforge-api
          cache-to: type=gha,mode=max,scope=resumeforge-api

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: resumeforge-web:ci
          cache-from: type=gha,scope=resumeforge-web
          cache-to: type=gha,mode=max,scope=resumeforge-web

      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: resumeforge-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: resumeforge-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resumeforge-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/resumeforge-api:latest
          cache-from: type=gha

      - name: Push Web Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resumeforge-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/resumeforge-web:latest
          cache-from: type=gha


