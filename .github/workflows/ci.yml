name: CI Security & Container Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Node.js dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix packages/resume-schema

      - name: Build resume schema
        run: npm run build --prefix packages/resume-schema

      - name: Build web application
        run: npm run build --prefix apps/web

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/analyzer/uv.lock

      - name: Sync API dependencies
        run: uv sync --project apps/api --locked

      - name: Install analyzer
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            apps/analyzer

      - name: Test API
        run: uv run --project apps/analyzer --with pytest pytest tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/javascript
            p/typescript
            p/python

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: npm audit
        run: npm audit --prefix apps/web --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.19"

      - name: Sync API dependencies for audit
        run: uv sync --project apps/api --locked

      - name: Install analyzer for audit
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            apps/analyzer

      - name: Audit Python dependencies
        run: |
          uv pip install --system pip-audit
          pip-audit --strict --desc --ignore-vuln PYSEC-0000

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: resumeforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: resumeforge-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.74.0"
          image-ref: resumeforge-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          

      - name: Scan Web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.74.0"
          image-ref: resumeforge-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resumeforge-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/resumeforge-api:latest
          cache-from: type=gha

      - name: Push Web image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resumeforge-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/resumeforge-web:latest
          cache-from: type=gha


