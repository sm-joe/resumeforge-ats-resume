name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install resume schema dependencies
        working-directory: packages/resume-schema
        run: npm ci

      - name: Build resume schema
        working-directory: packages/resume-schema
        run: npm run build

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/analyzer/uv.lock

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Install analyzer
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            apps/analyzer

      - name: Test API
        run: uv run --project apps/analyzer --with pytest pytest tests

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/javascript
            p/typescript
            p/python

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.19"

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Install analyzer
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            apps/analyzer

      - name: Audit Python dependencies
        run: |
          uv pip install --system pip-audit
          pip-audit --strict --desc --ignore-vuln PYSEC-0000

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: resumeforge-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: resumeforge-web:ci



