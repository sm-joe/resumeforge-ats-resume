name: CI & Tests

on:
  pull_request:
    branches: [main]
      
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      ci: ${{ steps.filter.outputs.ci }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ci:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'apps/analyzer/**'
              - 'packages/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'package-lock.json'
              - '**/pyproject.toml'
              - '**/uv.lock'
              - '**/package.json'
              - '**/package-lock.json'

  ci:
    name: CI Run
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.ci == 'true'

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/resume-schema/package-lock.json

      - name: Install Node.js Dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix packages/resume-schema

      - name: Build Resume Schema
        run: npm run build --prefix packages/resume-schema

      - name: Build Web Appplication
        run: npm run build --prefix apps/web

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            apps/analyzer/uv.lock
            apps/api/pyproject.toml
            apps/analyzer/pyproject.toml

      - name: Sync API Dependencies
        run: uv sync --project apps/api --locked

      - name: Install Analyzer
        run: |
          uv pip install \
            --python apps/api/.venv/bin/python \
            apps/analyzer

      - name: Test APIs
        run: uv run --project apps/analyzer --with pytest pytest tests

      - name: Test FastAPI Export Security
        run: uv run --project apps/api --with pytest pytest apps/api/tests

  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify Fast CI
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then exit 1; fi
          if [[ "$CI_RESULT" != "success" && "$CI_RESULT" != "skipped" ]]; then exit 1; fi
          echo "Fast development checks passed."
